# Configure valid SMTP and Slack credentials privately before enabling delivery.
global:
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alerts@example.com"
  smtp_auth_username: "alerts@example.com"
  smtp_auth_password: ""
  smtp_require_tls: true
  slack_api_url: "https://hooks.slack.com/services/REPLACE/REPLACE/REPLACE"

route:
  receiver: email-and-slack
  group_by: [alertname, job]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: email-and-slack
    email_configs:
      - to: "REPLACE_WITH_ALERT_RECIPIENT@example.com"
        send_resolved: true
    slack_configs:
      - channel: "#REPLACE_WITH_ALERT_CHANNEL"
        send_resolved: true
        title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }} - {{ .Annotations.description }}{{ end }}
